services:
  postgres:
    image: postgres:16-alpine
    container_name: hdb-advisor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hdb_advisor
      POSTGRES_PASSWORD: hdb_advisor
      POSTGRES_DB: hdb_advisor
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
